name: Build Custom Iosevka afio

on:
  push:
    paths:
      - 'private-build-plans.toml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-font:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install ttfautohint
        run: sudo apt-get update && sudo apt-get install -y ttfautohint

      - name: Install dependencies
        run: npm ci

      - name: Build afio font (TTF)
        run: npm run build -- ttf::afio

      - name: Package fonts
        run: |
          mkdir -p release
          find dist -type f -name "*.ttf" -exec cp {} release/ \;
          
          if [ ! -s release/*.ttf ]; then
            echo "❌ Error: No TTF files were found after build!"
            exit 1
          fi
          
          cd release
          zip -9 -r ../IosevkaAfio.zip *.ttf

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: afio-${{ github.run_number }}
          name: Iosevka Afio Build #${{ github.run_number }}
          body: |
            Automatic build of **Iosevka Afio**.
            
            - Build Number: ${{ github.run_number }}
            - Commit: [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            - Trigger: ${{ github.event_name }}
          files: IosevkaAfio.zip
          draft: false
          prerelease: false
